name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: full_circle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/full_circle
      PAYLOAD_SECRET: ci-only-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: action-setup errors if this and
      # package.json's `packageManager` both pin pnpm. package.json wins.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      - name: Apply database migrations
        run: pnpm migrate

      - run: pnpm build

      # The Playwright suite (axe + interaction tests) needs seeded content, and
      # the seed pulls the service copy from the client's live site — so it runs
      # locally via `pnpm test:e2e` rather than in CI.
